# TalentLens skill ontology
#
# Two jobs:
#   1. ALIASES collapse surface forms onto one canonical name, which is our
#      lexical answer to the vocabulary-mismatch gap ("js" and "ECMAScript"
#      must not read as different skills from "javascript").
#   2. PARENTS encode implication: holding a child implies the parent. Someone
#      who ships Django demonstrably writes Python, so a JD asking for Python
#      should not mark them as missing it. Expansion walks parents transitively.
#
# Parent edges must stay a DAG - the loader raises on cycles.
# Keep canonical names lowercase, hyphenated, and singular.

skills:

